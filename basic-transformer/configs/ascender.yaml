# ==========================================
# ASCender Experiment Configuration
# ==========================================

# Transformer Attention Mode
# (Choose between: multiplicative / additive)

dataset:
  name: "wikitext-2-v1"   # or "wikitext-103-v1"
  seq_len: 128
  batch_size: 8
  vocab_size: 30000
  num_workers: 2
  pin_memory: true

mode: multiplicative

experiment:
  name: ascender
  seeds: [42, 43, 44]      # 3 seeds for robustness
  epochs: 10               # bias 효과 누적 관찰
  batch_size: 8            # 작은 배치 → gradient variance 확대
  lr: 0.0005               # 안정적 학습률
  warmup_steps: 200        # 빠른 warmup → bias 조기 활성화
  clip_grad: 0.8
  smoothing: 0.05          # label noise 완화로 bias 효과 강화

model:
  src_vocab_size: 1000
  tgt_vocab_size: 1000
  d_model: 256
  n_heads: 8
  n_layers_enc: 3
  n_layers_dec: 3
  d_ff: 1024
  dropout: 0.2             # 구조적 bias 방향성이 두드러지게
  pad_id: 0

  # === ASCender Bias Settings ===
  use_ascender: true       # False → baseline transformer
  asc_bias_enc: true
  asc_bias_dec_self: true
  asc_bias_dec_cross: true

  asc_cfg:
    # component switches
    use_alignment:  true
    use_separation: true
    use_cohesion:   true

    # weights
    w_align: 1.5
    w_sep: 0.7
    w_coh: 8.0

    # kernels / options (기본값 그대로면 생략 가능)
    sigma_sep: 1.0
    sigma_coh: 4.0
    align_source: "qk"     # or "preproj"
    temperature: 1.0
    clamp_min: -2.0
    clamp_max: 2.0

# ==========================================
# Notes:
# - baseline → use_ascender: false
# - single bias ablations → set β to 0 for others
#     e.g. Alignment only → β_A=1.5, β_S=0.0, β_C=0.0
# - Full ASCender → all β active
# ==========================================
