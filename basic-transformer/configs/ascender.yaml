# ==========================================
# ASCender Experiment Configuration (AGGRESSIVE-STABLE)
# Single source of truth for train.py / transformer.py / ascender_bias.py
# ==========================================

dataset:
  name: "wikitext-2-v1"        # or "wikitext-103-v1"
  seq_len: 128
  batch_size: 8
  vocab_size: 30000
  num_workers: 2
  pin_memory: true

# Transformer Attention Mode
mode: additive                 # ASCender uses additive bias before softmax

experiment:
  name: ascender_aggressive_stable
  seeds: [42, 43, 44]
  epochs: 10
  batch_size: 8
  lr: 0.0005                   # base model LR
  lr_asc: 0.0005               # ASC params LR (kept constant by train.py)
  warmup_steps: 200
  clip_grad: 0.8
  smoothing: 0.0

model:
  src_vocab_size: 30000
  tgt_vocab_size: 30000
  d_model: 256
  n_heads: 8
  n_layers_enc: 3
  n_layers_dec: 3
  d_ff: 1024
  dropout: 0.1
  pad_id: 0

  # === ASCender Bias Attachments ===
  use_ascender: true
  asc_bias_enc: false            # encoder OFF (keeps training stable)
  asc_bias_dec_self: true        # decoder self-attn ON (L0~L1 attached by code)
  asc_bias_dec_cross: false      # cross-attn OFF (recommended)

  # === Debug / Probes ===
  # 0이면 스냅샷/프로브 비활성(권장). 디버깅 때만 200~500으로.
  probe_every: 0

  # === ASCender Bias Config ===
  asc_cfg:
    # ---- Components (A + C; S off for stability) ----
    use_alignment:  true
    use_separation: false
    use_cohesion:   true

    # ---- Component weights (pre-γ; direction shaping only) ----
    # Magnitude is dominated by std-match ratio (r) in MHA; keep weights moderate.
    w_align: 0.22
    w_sep:   0.12
    w_coh:   0.10

    # ---- Positional kernels ----
    sigma_sep: 1.0
    sigma_coh: 3.0

    # ---- Alignment options ----
    align_source: "qk"           # (Plan B: "preproj" if you want embedding-level)
    temperature: 1.0

    # ---- Safety clamp before γ ----
    clamp_min: -2.0
    clamp_max: 2.0

    # ---- Directionality & band-pass (focus on short/mid range) ----
    past_only: true
    band_min: 0
    band_max: 48

    # ---- Per-head heterogeneity (aggressive but safe) ----
    per_head_scale: true         # learn per-head γ
    per_head_gate:  false        # keep global gate for stability

    # ---- Global scaling & gate ----
    global_scale_init: 0.9       # higher initial γ for faster effect
    use_gate: true
    gate_init: -1.6              # slightly more open than default
    gate_floor: 0.30
    gate_ceiling: 0.65           # train.py will cap to 0.65 from epoch ≥ 2

    # ---- Auto-calibration (off to avoid fighting τ/r schedules) ----
    use_auto_calibrate: false
    target_ratio: 0.45
    calibrate_step_clamp_lo: 0.90
    calibrate_step_clamp_hi: 1.12
    ema_momentum: 0.90

    # ---- Runtime safety caps ----
    hard_max_ratio: 0.85         # allow stronger bias before hard limit
    hard_target_ratio: 0.55
    gamma_min: 0.25
    gamma_cap: 6.0               # matches MHA bias_softcap; aggressive but bounded

    # ---- Symmetry break ----
    jitter_std: 1e-3

    # ---- ALiBi convex mix (keep fixed) ----
    use_alibi_mix: false
    alpha_start: 0.85
    alpha_end: 0.90
    alpha_schedule: "cosine"       # fixed α for simplicity
    alpha_total_steps: 2000

    # ---- Batch std aggregation for scaling upstream ----
    std_batch_mean: true
