# ==========================================
# ASCender Experiment Configuration (AGGRO • final)
# ==========================================

dataset:
  name: "wikitext-2-v1"
  seq_len: 256
  batch_size: 4
  vocab_size: 30000
  num_workers: 2
  pin_memory: true

mode: additive

experiment:
  name: ascender_coh_align_light
  seeds: [42]
  epochs: 3
  batch_size: 4
  lr: 0.0005
  lr_asc: 0.0005
  warmup_steps: 200
  clip_grad: 0.8
  smoothing: 0.00

model:
  src_vocab_size: 30000
  tgt_vocab_size: 30000

  d_model: 256
  n_heads: 8
  n_layers_enc: 3
  n_layers_dec: 3
  d_ff: 1024
  dropout: 0.0
  pad_id: 0

  # === ASCender Bias Settings ===
  use_ascender: true
  asc_bias_enc: false
  asc_bias_dec_self: true
  asc_bias_dec_cross: false

  # === Debug / Probes ===
  # 0이면 스냅샷/프로브 비활성(권장). 디버깅 때만 200~500으로.
  probe_every: 50

  asc_cfg:
    # Plan: cohesion + light alignment (Δp↑, 과개입 방지)
    use_alignment:  true
    use_separation: false
    use_cohesion:   true

    # weights (Δp 상향 유지)
    w_align: 10.0
    w_sep:   0.00
    w_coh:   10.0

    # Positional kernels
    sigma_sep: 1.0
    sigma_coh: 3.0

    # Alignment options
    align_source: "qk"
    temperature: 1.0

    # Stabilize pre-γ
    clamp_min: -2.0
    clamp_max:  2.0

    # Directionality & band-pass
    past_only: true
    band_min: 0
    band_max: 48   # 필요시 None

    # per-head
    per_head_scale: true
    per_head_gate:  false

    # scaling (γ) & gate (σ)
    global_scale_init: 1.0
    use_gate: true
    gate_init: -0.6          # 초깃값 ≈ 0.35 부근
    gate_floor: 0.35
    gate_ceiling: 0.65       # 단일 소스 (train.py에서 재캡 금지)

    # === ALiBi convex mix (ASC ⟷ ALiBi) ===
    use_alibi_mix: true
    alpha_start: 0.20         # 초반 ALiBi 비중↑(1-α)
    alpha_end:   0.70         # 중반 이후 ASC 비중↑
    alpha_schedule: "cosine"
    alpha_total_steps: 1500    # 로더 총 step에 맞춰 필요시만 조정

    # === Auto-calibration (Δp 타깃팅) ===
    use_auto_calibrate: true
    target_ratio: 0.30         # L0 bias_ratio 타깃 (로그상 sweet spot 0.23~0.32)
    calibrate_step_clamp_lo: 0.90
    calibrate_step_clamp_hi: 1.12
    ema_momentum: 0.90

    # === Runtime safety / caps ===
    hard_max_ratio: 0.85       # 절대 상한(폭주 방지)
    hard_target_ratio: 0.55    # 타깃 상한
    gamma_min: 0.90
    # gamma_max: 1.6             # 하나만 둠(중복 cap 제거)
    gamma_cap: 6.0

    # Symmetry break
    jitter_std: 0.001

    # batch std aggregation for bias scaling
    std_batch_mean: true
