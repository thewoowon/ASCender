# ==========================================
# ASCender Experiment Configuration
# ==========================================

# Transformer Attention Mode
# (Choose between: multiplicative / additive)

dataset:
  name: "wikitext-2-v1"   # or "wikitext-103-v1"
  seq_len: 128
  batch_size: 8
  vocab_size: 30000
  num_workers: 2
  pin_memory: true

mode: additive   # ⬅️ ASCender는 softmax 이전 additive가 효과적

experiment:
  name: baseline_additive
  seeds: [42, 43, 44]      # 3 seeds for robustness
  epochs: 10               # bias 효과 누적 관찰
  batch_size: 8            # 작은 배치 → gradient variance 확대
  lr: 0.0005               # 안정적 학습률
  warmup_steps: 200        # 빠른 warmup (Noam과 병행 시 내부 스케줄러 우선)
  clip_grad: 0.8
  smoothing: 0.05          # label noise 완화로 bias 효과 강화

model:
  src_vocab_size: 1000
  tgt_vocab_size: 1000
  d_model: 256
  n_heads: 8
  n_layers_enc: 3
  n_layers_dec: 3
  d_ff: 1024
  dropout: 0.1             # 구조적 bias 방향성이 두드러지게
  pad_id: 0

  # === ASCender Bias Settings ===
  use_ascender: false
  asc_bias_enc: false
  asc_bias_dec_self: true
  asc_bias_dec_cross: false

  asc_cfg:
    # component switches
    use_alignment:  true
    use_separation: false
    use_cohesion:   true

    # weights (z-score된 컴포넌트에 곱해짐)
    w_align: 1.1    # 주 신호
    w_sep:   0.0    # 초기 학습 방해 최소화
    w_coh:   0.3    # 과도한 상수 성분 방지

    # kernels / options
    sigma_sep: 1.0
    sigma_coh: 2.5  # ⬅️ 4.0→3.0: 평탄화 완화로 대비↑
    align_source: "qk"     # or "preproj"
    temperature: 1.0
    clamp_min: -2.0
    clamp_max: 2.0

    # directional & band-pass
    past_only: true
    band_min: 2                 # 중거리만 활성
    band_max: 8

    # scaling (γ) & gate (σ)
    per_head_scale: true        # 헤드별 γ
    global_scale_init: 1.0      # 작게 시작 → 학습으로 보정
    use_gate: true
    per_head_gate: true        # 필요시 true로 실험
    gate_init: 0.0              # σ(0)=0.5

    # (옵션) 자동 스케일 캘리브레이션 — 기본은 비활성
    use_auto_calibrate: false   # true로 켜면 scores_std 전달 필요
    target_ratio: 0.5
    calibrate_step_clamp_lo: 0.9
    calibrate_step_clamp_hi: 1.1
    ema_momentum: 0.9
# ==========================================
# Notes:
# - baseline → use_ascender: false
# - ablations → 특정 가중치 0으로
#   e.g. Alignment only → w_align=1.5, w_sep=0.0, w_coh=0.0
# - 필요시 sep warmup은 트레이너에서 스케줄링(초기 몇천 스텝 0→w_sep)
# ==========================================
