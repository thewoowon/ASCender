# ==========================================
# Baseline Transformer Configuration
# (No ASCender Bias)
# ==========================================

dataset:
  name: "wikitext-2-v1"
  seq_len: 128
  batch_size: 8
  vocab_size: 30000
  num_workers: 2
  pin_memory: true

# transformer variant (additive/multiplicative 둘 다 가능)
mode: multiplicative

experiment:
  seeds: [42, 43, 44]
  name: baseline_multiplicative
  epochs: 10
  batch_size: 8
  lr: 0.0005
  warmup_steps: 200
  clip_grad: 0.8
  smoothing: 0.05

model:
  src_vocab_size: 1000
  tgt_vocab_size: 1000
  d_model: 256
  n_heads: 8
  n_layers_enc: 3
  n_layers_dec: 3
  d_ff: 1024
  dropout: 0.2
  pad_id: 0

  # 🚫 ASCender Bias 완전 비활성화
  use_ascender: false
  asc_bias_enc: false
  asc_bias_dec_self: false
  asc_bias_dec_cross: false

  asc_cfg:
    # component switches
    use_alignment:  true
    use_separation: true
    use_cohesion:   true

    # weights
    w_align: 1.5
    w_sep: 0.7
    w_coh: 8.0

    # kernels / options (기본값 그대로면 생략 가능)
    sigma_sep: 1.0
    sigma_coh: 4.0
    align_source: "qk"     # or "preproj"
    temperature: 1.0
    clamp_min: -2.0
    clamp_max: 2.0
